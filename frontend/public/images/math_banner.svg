<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Calculus Math Curves -->
  <path d="M 100 480 Q 400 100 700 350 T 1100 200" fill="none" stroke="url(#lineGrad)" stroke-width="5" opacity="0.85" />
  <path d="M 100 520 Q 500 500 800 200 T 1100 150" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" opacity="0.7" />

  <!-- Math Symbols Decorative -->
  <text x="120" y="220" font-family="'Inter', sans-serif" font-size="72" font-weight="bold" fill="#2dd4bf" opacity="0.3">∫</text>
  <text x="950" y="450" font-family="'Inter', sans-serif" font-size="80" font-weight="bold" fill="#38bdf8" opacity="0.25">∂Q/∂L</text>
  <text x="800" y="160" font-family="'Inter', sans-serif" font-size="64" font-weight="bold" fill="#f59e0b" opacity="0.2">MR = MC</text>

  <!-- Overlay Header Text -->
  <rect x="80" y="230" width="680" height="240" rx="16" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="120" y="300" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#2dd4bf" letter-spacing="3">UEH TOÁN CAO CẤP</text>
  <text x="120" y="360" font-family="'Inter', sans-serif" font-size="40" font-weight="800" fill="#ffffff">Ứng Dụng Toán Kinh Tế</text>
  <text x="120" y="420" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#94a3b8">Vi Mô, Vĩ Mô & Bộ Đề Thi K46 - K51 UEH</text>
</svg>
