<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Frame -->
  <rect width="800" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="400" y="42" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.01em">ĐỒ THỊ QUY TẮC ĐIỂM ĐÁY: ĐƯỜNG MC CẮT ĐƯỜNG AC TẠI MIN(AC)</text>
  <text x="400" y="65" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Quy tắc tối ưu hóa chi phí trung bình trong Kinh tế Vi mô (Chương 5 PNTA)</text>

  <!-- Grid & Axes -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="110" x2="720" y2="110" />
    <line x1="100" y1="180" x2="720" y2="180" />
    <line x1="100" y1="250" x2="720" y2="250" />
    <line x1="100" y1="320" x2="720" y2="320" />
    <line x1="100" y1="390" x2="720" y2="390" />
  </g>

  <!-- Axes -->
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="390" x2="100" y2="90" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <!-- Arrows -->
  <path d="M 715 385 L 725 390 L 715 395 Z" fill="#334155" />
  <path d="M 95 95 L 100 85 L 105 95 Z" fill="#334155" />

  <text x="735" y="395" font-size="14" font-weight="700" fill="#334155">Sản lượng (q)</text>
  <text x="100" y="75" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Chi phí (C, MC, AC)</text>

  <!-- AC Curve (U-shaped Curve) -->
  <!-- Minimum at q = 380, C = 260 -->
  <path d="M 140 140 C 220 330, 320 280, 400 280 C 480 280, 580 300, 680 180" fill="none" stroke="url(#acGrad)" stroke-width="3.5" stroke-linecap="round" />
  <text x="690" y="175" font-size="16" font-weight="800" fill="#0369a1">AC (Average Cost)</text>

  <!-- MC Curve (Sharper U-shaped Curve intersecting AC at min) -->
  <path d="M 160 360 C 250 360, 330 340, 400 280 C 470 210, 560 120, 640 100" fill="none" stroke="url(#mcGrad)" stroke-width="3.5" stroke-linecap="round" />
  <text x="650" y="95" font-size="16" font-weight="800" fill="#b91c1c">MC (Marginal Cost)</text>

  <!-- Intersection Point (q*, AC_min) -->
  <line x1="400" y1="280" x2="400" y2="390" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
  <line x1="100" y1="280" x2="400" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
  
  <circle cx="400" cy="280" r="6" fill="#15803d" stroke="#ffffff" stroke-width="2" />

  <text x="400" y="415" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">q* (Sản lượng tối ưu AC_min)</text>
  <text x="85" y="284" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">AC_min</text>

  <!-- Annotation Box -->
  <rect x="420" y="220" width="260" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="430" y="240" font-size="12" font-weight="700" fill="#15803d">Điểm đáy: MC = AC</text>
  <text x="430" y="258" font-size="11" font-weight="500" fill="#166534">Đạo hàm d(AC)/dq = (MC - AC)/q = 0</text>
</svg>
