<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="mplGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="aplGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="800" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="400" y="42" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.01em">ĐỒ THỊ NĂNG SUẤT BIÊN (MPL) VÀ NĂNG SUẤT TRUNG BÌNH (APL)</text>
  <text x="400" y="65" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Mối quan hệ cắt nhau tại điểm cực đại của APL (Chương 5 PNTA)</text>

  <!-- Grid -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="100" y1="110" x2="720" y2="110" />
    <line x1="100" y1="180" x2="720" y2="180" />
    <line x1="100" y1="250" x2="720" y2="250" />
    <line x1="100" y1="320" x2="720" y2="320" />
    <line x1="100" y1="390" x2="720" y2="390" />
  </g>

  <!-- Axes -->
  <line x1="100" y1="390" x2="720" y2="390" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="390" x2="100" y2="90" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 715 385 L 725 390 L 715 395 Z" fill="#334155" />
  <path d="M 95 95 L 100 85 L 105 95 Z" fill="#334155" />

  <text x="735" y="395" font-size="14" font-weight="700" fill="#334155">Lao động (L)</text>
  <text x="100" y="75" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Năng suất (APL, MPL)</text>

  <!-- APL Curve (Broad inverted U) -->
  <path d="M 120 370 C 220 200, 320 180, 420 180 C 520 180, 620 280, 700 370" fill="none" stroke="url(#aplGrad)" stroke-width="3.5" stroke-linecap="round" />
  <text x="690" y="350" font-size="16" font-weight="800" fill="#6d28d9">APL (Average Product)</text>

  <!-- MPL Curve (Steeper inverted U intersecting APL at max) -->
  <path d="M 120 340 C 200 110, 320 100, 420 180 C 490 230, 560 380, 620 420" fill="none" stroke="url(#mplGrad)" stroke-width="3.5" stroke-linecap="round" />
  <text x="580" y="440" font-size="16" font-weight="800" fill="#15803d">MPL (Marginal Product)</text>

  <!-- Intersection Point (L*, APL_max) -->
  <line x1="420" y1="180" x2="420" y2="390" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
  <line x1="100" y1="180" x2="420" y2="180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
  
  <circle cx="420" cy="180" r="6" fill="#0f766e" stroke="#ffffff" stroke-width="2" />

  <text x="420" y="415" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">L* (Mức lao động đạt max APL)</text>
  <text x="85" y="184" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">APL_max</text>

  <!-- Callout -->
  <rect x="440" y="120" width="250" height="50" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1" />
  <text x="450" y="140" font-size="12" font-weight="700" fill="#6d28d9">Mối quan hệ: MPL = APL</text>
  <text x="450" y="158" font-size="11" font-weight="500" fill="#581c87">Đồ thị MPL cắt APL tại điểm cực đại APL</text>
</svg>
