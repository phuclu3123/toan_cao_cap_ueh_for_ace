<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Đạo hàm kinh tế và giao điểm doanh thu biên, chi phí biên</title>
  <desc id="description">Minh họa đường doanh thu biên MR, chi phí biên MC và điểm sản lượng tối ưu q sao.</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a13"/>
      <stop offset="0.58" stop-color="#0d3023"/>
      <stop offset="1" stop-color="#15583e"/>
    </linearGradient>
    <linearGradient id="cover-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61d69f"/>
      <stop offset="1" stop-color="#b5f2d4"/>
    </linearGradient>
    <linearGradient id="cover-warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e6a443"/>
      <stop offset="1" stop-color="#ffd590"/>
    </linearGradient>
    <filter id="point-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#cover-bg)"/>
  <circle cx="1068" cy="48" r="250" fill="#6de0aa" opacity="0.07"/>
  <circle cx="90" cy="600" r="260" fill="#e6a443" opacity="0.06"/>

  <g stroke="#d9f4e7" stroke-width="1" opacity="0.08">
    <path d="M0 90H1200M0 170H1200M0 250H1200M0 330H1200M0 410H1200M0 490H1200M0 570H1200"/>
    <path d="M80 0V630M160 0V630M240 0V630M320 0V630M400 0V630M480 0V630M560 0V630M640 0V630M720 0V630M800 0V630M880 0V630M960 0V630M1040 0V630M1120 0V630"/>
  </g>

  <g transform="translate(74 70)">
    <rect width="1052" height="490" rx="28" fill="#06150f" opacity="0.38" stroke="#9fe8c5" stroke-opacity="0.16"/>
    <path d="M82 72V405H672" fill="none" stroke="#d8ece2" stroke-width="3" stroke-linecap="round" opacity="0.64"/>
    <path d="M128 128L626 356" fill="none" stroke="url(#cover-glow)" stroke-width="9" stroke-linecap="round"/>
    <path d="M128 358C250 345 340 300 404 242C480 173 550 130 626 94" fill="none" stroke="url(#cover-warm)" stroke-width="9" stroke-linecap="round"/>
    <path d="M404 242V405" fill="none" stroke="#d8ece2" stroke-width="2" stroke-dasharray="8 9" opacity="0.5"/>
    <circle cx="404" cy="242" r="19" fill="#0b281d" stroke="#effff6" stroke-width="9" filter="url(#point-shadow)"/>

    <text x="638" y="376" fill="#a8efd0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">MR</text>
    <text x="638" y="96" fill="#ffd590" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">MC</text>
    <text x="404" y="444" text-anchor="middle" fill="#d8ece2" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">q*</text>
    <rect x="325" y="152" width="158" height="58" rx="18" fill="#f4fff9"/>
    <text x="404" y="190" text-anchor="middle" fill="#104934" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850">MR = MC</text>

    <g transform="translate(730 62)">
      <text x="0" y="0" fill="#6cdeb0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850" letter-spacing="3">CHUYÊN KHẢO · CHƯƠNG 5</text>
      <text x="0" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="51" font-weight="850">
        <tspan x="0" dy="0">ĐẠO HÀM</tspan>
        <tspan x="0" dy="58">KINH TẾ</tspan>
      </text>
      <text x="0" y="235" fill="#d8ece2" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">
        <tspan x="0" dy="0">Đại lượng biên · Co giãn</tspan>
        <tspan x="0" dy="38">Lời giải đề K46–K51</tspan>
      </text>
      <rect x="0" y="330" width="228" height="46" rx="23" fill="#6cdeb0" opacity="0.14" stroke="#77e8b9" stroke-opacity="0.6"/>
      <text x="114" y="360" text-anchor="middle" fill="#b7f5d7" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">UEH TCC · SOURCE CHECKED</text>
    </g>
  </g>
</svg>
